name: BIST Intraday Live Paper Trading

on:
  schedule:
    # Hafta içi her gün saat 07:00 - 15:00 UTC (TSİ 10:00 - 18:00) arası her 30 dakikada bir çalışır
    - cron: '*/30 7-15 * * 1-5'
  workflow_dispatch: # GitHub arayüzünden manuel tetikleme butonu

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas yfinance scipy statsmodels

      - name: Strateji 3 (Rekor Şampiyon B2 1x1) Canlı Sinyal ve Rebalance
        run: |
          python strateji_3_test_b2_1x1.py --run

      - name: Sanal Portföy Durumunu Kaydet (Commit & Push)
        run: |
          set -euo pipefail
          set -x

          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"

          # Determine branch reliably from GITHUB_REF (refs/heads/<branch>)
          BRANCH="${GITHUB_REF#refs/heads/}"
          if [ -z "$BRANCH" ]; then
            echo "GITHUB_REF is empty, trying github.ref_name env fallback"
            BRANCH="${GITHUB_REF_NAME:-main}"
          fi
          echo "Target branch: $BRANCH"

          # Ensure we are on the branch (avoid detached HEAD)
          git fetch --no-tags --prune origin "$BRANCH":refs/remotes/origin/"$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH" || git checkout -B "$BRANCH"

          # Stage portfolio files
          git add portfolio_*.json || true

          # If no changes staged, exit successfully
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Auto Update: Paper Portfolio State [skip ci]" || true

          # Integrate remote commits safely
          if git pull --rebase --autostash origin "$BRANCH"; then
            echo "Rebase/pull succeeded"
          else
            echo "Rebase failed; attempting to abort and continue"
            git rebase --abort || true
            git pull --no-edit origin "$BRANCH" || true
          fi

          # Push. First try normal push, then fallback to force-with-lease
          if git push origin "$BRANCH"; then
            echo "Push succeeded"
          else
            echo "Normal push failed; trying push --force-with-lease"
            git push --force-with-lease origin "$BRANCH"
          fi
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
